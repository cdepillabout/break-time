name: CI

# Trigger the workflow on push or pull request, but only for the master branch
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    name: rust cargo / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the same nix-shell as the dev machines so CI builds with the exact
      # pinned toolchain (rustc/clippy/rustfmt) and system libraries (GTK,
      # pkg-config) — no separate toolchain action or apt install needed.
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: nix-shell --run 'cargo check'

      - name: Run cargo build
        run: nix-shell --run 'cargo build'

      - name: Run cargo test
        run: nix-shell --run 'cargo test'

      - name: Run cargo clippy
        run: nix-shell --run 'cargo clippy -- -D warnings'

      - name: Run cargo fmt
        run: nix-shell --run 'cargo fmt --all -- --check'

      - name: build with nix
        run: nix-build
