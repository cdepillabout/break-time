[package]
name = "break-time"
version = "0.1.2"
authors = ["cdepillabout@gmail.com"]
edition = "2021"
description = "An app to force you to take breaks regularly while using the computer"
license = "MIT"
repository = "https://github.com/cdepillabout/break-time"
readme = "README.md"
keywords = ["gtk", "break", "reminder", "gui"]
categories = ["gui"]
default-run = "break-time"

[dependencies]
# Cross-platform core (no GUI / display-server / platform deps here).
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
indoc = "2"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
toml = "0.8"

# Google Calendar meeting-detection plugin — a heavy async stack (tokio + hyper
# + rustls), so it lives behind the `google-calendar` feature and a lean build
# (e.g. the first macOS port) can drop it entirely.
google-calendar3 = { version = "7.0.0", optional = true }
# `ring` crypto provider instead of rustls's default `aws-lc-rs` (which needs
# cmake to build); otherwise the standard rustls feature set.
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread"], optional = true }
yup-oauth2 = { version = "12.1.2", optional = true }

# Linux: the GTK3 GUI stack (break window + tray) and the pure-Rust X11 display
# backend. None of these are linked on other targets.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
gtk = { version = "0.18", features = ["v3_24"] }
pango = "0.18"
x11rb = { version = "0.13.2", features = ["screensaver"], optional = true }

# macOS: native Cocoa / Quartz via the objc2 ecosystem (break window, run loop,
# and — in later commits — the CGEventTap lock, idle detection, and tray).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEventSource",
    "CGEventTypes",
    "CGWindowLevel",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSGeometry",
    "NSString",
    "NSThread",
    "NSTimer",
] }

[features]
# `default` builds everything valid for the host OS. On Linux that is the X11
# backend plus Google Calendar; `x11` is inert on macOS (x11rb is a Linux-only
# dependency), so the same default is harmless there.
default = ["google-calendar", "x11"]
# The Google Calendar meeting-detection plugin (see the dependency block above).
google-calendar = ["dep:google-calendar3", "dep:rustls", "dep:tokio", "dep:yup-oauth2"]
# Placeholder for a future native Wayland backend.
wayland = []
# Compile in the X11 display backend (Linux; also covers Wayland via XWayland).
x11 = ["dep:x11rb"]
