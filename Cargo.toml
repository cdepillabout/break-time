[package]
name = "break-time"
version = "0.1.2"
authors = ["cdepillabout@gmail.com"]
edition = "2021"
description = "An app to force you to take breaks regularly while using the computer"
license = "MIT"
repository = "https://github.com/cdepillabout/break-time"
readme = "README.md"
keywords = ["gtk", "break", "reminder", "gui"]
categories = ["gui"]
default-run = "break-time"

[dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive"] }
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
google-calendar3 = "7.0.0"
gtk = { version = "0.18", features = ["v3_24"] }
indoc = "2"
pango = "0.18"
# `ring` crypto provider instead of rustls's default `aws-lc-rs` (which needs
# cmake to build); otherwise the standard rustls feature set.
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
toml = "0.8"
x11rb = { version = "0.13.2", features = ["screensaver"] }
xdg = "2.2.0"
yup-oauth2 = "12.1.2"
